name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压项目
        run: |
          if [ -f project.zip ]; then unzip -o project.zip; fi
          ls -la
          test -f settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 打包 APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FaceSwapLocal.apk
          gh release create "build-${{ github.run_number }}" FaceSwapLocal.apk \
            --title "构建 ${{ github.run_number }}" \
            --notes "安装 FaceSwapLocal.apk 即可"
