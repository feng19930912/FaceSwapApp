name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 解压项目
        run: |
          if [ -f project.zip ]; then unzip -o project.zip; fi
          ls -la
          test -f settings.gradle.kts
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 打包 APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK（Artifacts 备份）
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapLocal-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FaceSwapLocal.apk
          gh release create "build-${{ github.run_number }}" FaceSwapLocal.apk \
            --title "构建 ${{ github.run_number }}" \
            --notes "安装 FaceSwapLocal.apk 即可"
